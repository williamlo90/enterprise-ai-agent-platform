server {
 listen 8080;
 server_tokens off;
 access_log off;
 error_log /dev/null crit;
 client_max_body_size 11m;
 client_body_timeout 10s;
 client_body_buffer_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 add_header Strict-Transport-Security "max-age=86400" always;
 location = /healthz { return 200 'alive'; add_header Content-Type text/plain; }
 location /internal/ { return 404; }
 location /api/ {
  proxy_pass https://platform-api.enterprise-ai.svc.cluster.local;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/eai/tls/ca.crt;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 65s;
  proxy_connect_timeout 3s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  add_header Cache-Control no-store always;
 }
 location = /index.html { root /usr/share/nginx/html; add_header Cache-Control no-store always; }
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
