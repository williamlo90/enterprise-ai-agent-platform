server {
 listen 8443 ssl;
 server_tokens off;
 access_log off;
 error_log /dev/null crit;
 ssl_certificate /etc/eai/tls/tls.crt;
 ssl_certificate_key /etc/eai/tls/tls.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 11m;
 client_body_buffer_size 11m;
 client_body_timeout 10s;
 location / { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_buffering off; proxy_request_buffering off; proxy_max_temp_file_size 0; }
}
