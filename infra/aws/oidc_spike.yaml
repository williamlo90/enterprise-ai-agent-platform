AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable Cognito feasibility probe. No enterprise platform sessions.
Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  ProbeName:
    Type: String
    AllowedPattern: 'eai-oidc-spike-[a-z0-9-]{1,40}'
  Issuer:
    Type: String
  ClientId:
    Type: String
  AuthorizationEndpoint:
    Type: String
  TokenEndpoint:
    Type: String
  JwksUri:
    Type: String
Resources:
  ProbeSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Client secret and ephemeral operator/encryption keys for the isolated OIDC spike.
  Transactions:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ProbeName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProbeName}'
      RetentionInDays: 1
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IsolatedSpikeStoreAndMetadataLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt Transactions.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt Logs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ProbeSecrets
  Function:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Ref ProbeName
      Runtime: python3.13
      Architectures: [x86_64]
      Handler: enterprise_ai_platform.oidc_spike_lambda.handler
      Role: !GetAtt ExecutionRole.Arn
      MemorySize: 256
      Timeout: 25
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      TracingConfig:
        Mode: PassThrough
      Environment:
        Variables:
          SPIKE_ENABLED: 'false'
          SPIKE_TABLE_NAME: !Ref Transactions
          SPIKE_SECRET_ARN: !Ref ProbeSecrets
          OIDC_ISSUER: !Ref Issuer
          OIDC_CLIENT_ID: !Ref ClientId
          OIDC_AUTHORIZATION_ENDPOINT: !Ref AuthorizationEndpoint
          OIDC_TOKEN_ENDPOINT: !Ref TokenEndpoint
          OIDC_JWKS_URI: !Ref JwksUri
          OIDC_REDIRECT_URI: 'https://unconfigured.invalid/api/v1/auth/callback'
          PUBLIC_ORIGIN: 'https://unconfigured.invalid'
  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
Outputs:
  ProbeUrl:
    Value: !GetAtt Url.FunctionUrl
  FunctionName:
    Value: !Ref Function
  TableName:
    Value: !Ref Transactions
  LogGroup:
    Value: !Ref Logs
  SecretArn:
    Value: !Ref ProbeSecrets
