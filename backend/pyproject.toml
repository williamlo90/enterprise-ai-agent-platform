[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "Enterprise AI Agent Platform backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
enterprise-ai-api = "enterprise_ai_platform.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
