[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "Enterprise AI Agent Platform backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.115,<1",
    "psycopg-pool>=3.3,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
enterprise-ai-api = "enterprise_ai_platform.main:main"
enterprise-ai-db-check = "enterprise_ai_platform.database_check:main"
enterprise-ai-migrate = "enterprise_ai_platform.migration_cli:main"
enterprise-ai-security = "enterprise_ai_platform.security_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build==0.11.26"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
