name: Documentation checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ai-documentation
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check published local links without services or provider calls
        run: python scripts/checks/check_public_docs.py
