name: Build and operator deployment
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply reviewed manifests after operator completed migration/secrets
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: enterprise-ai-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    environment: aws-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable release images, serially; no tests or inference
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          KUBECTL_VERSION: ${{ vars.KUBECTL_VERSION }}
        run: |
          set -eu
          for component in api reference worker web; do
            docker build --build-arg KUBECTL_VERSION="$KUBECTL_VERSION" -f "deployment/Dockerfile.$component" -t "$REGISTRY/eai-$component:$TAG" .
            docker push "$REGISTRY/eai-$component:$TAG"
          done
          docker build -t "$REGISTRY/eai-parser:$TAG" scripts/spikes/storage
          docker push "$REGISTRY/eai-parser:$TAG"
          mkdir -p release
          for component in api reference worker web parser; do
            aws ecr describe-images --repository-name "eai-$component" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text > "release/$component.digest"
          done
          cp infra/journal/handler.py release/handler.py
          (cd release && zip journal.zip handler.py)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release/
      - name: Render and apply operator-selected release
        if: inputs.deploy
        env:
          CONFIG: ${{ vars.DEPLOYMENT_CONFIG_JSON }}
          TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -eu
          mkdir -p deployment/generated
          python - <<'PY'
          import json,os,pathlib
          c=json.loads(os.environ['CONFIG'])
          c.update(image_tag=os.environ['TAG'],registry=os.environ['REGISTRY'],parser_image=os.environ['REGISTRY']+'/eai-parser@'+pathlib.Path('release/parser.digest').read_text().strip())
          pathlib.Path('deployment/generated/target.json').write_text(json.dumps(c))
          PY
          python deployment/render.py --config deployment/generated/target.json --out deployment/generated/manifest.json
          CLUSTER=$(python -c "import json; print(json.load(open('deployment/generated/target.json'))['cluster'])")
          aws eks update-kubeconfig --region ap-southeast-1 --name "$CLUSTER"
          kubectl apply -f deployment/generated/manifest.json
